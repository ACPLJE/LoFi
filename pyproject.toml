[project]
name = "lofi"
version = "0.1.0"
description = "Calibration-free KV cache compression via low-frequency RoPE channels"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

[tool.setuptools]
packages = ["lofi", "lofi.models", "eval", "third_party", "third_party.transformers_v433"]

[tool.ruff]
line-length = 100
target-version = "py310"
# Vendored third-party code is kept byte-for-byte apart from its provenance
# docstring, so reformatting or relinting it is out of scope. Reformatting the
# LongBench metrics in particular would put the scores in question.
extend-exclude = ["third_party", "eval/longbench_metrics.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RET", "ARG", "PTH"]
ignore = [
    # Shadowing a builtin is fine for the local `max`/`min`-style names used in
    # tensor code.
    "A003",
]

[tool.ruff.lint.per-file-ignores]
# Tests intentionally use bare asserts and long parametrize tables.
"tests/*" = ["ARG001"]
# Scripts import after sys.path setup so a clone runs without installation.
"scripts/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:pkg_resources is deprecated:UserWarning",
    "ignore:Using slow pure-python SequenceMatcher:UserWarning",
]
