[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lofi"
version = "1.1.0"
description = "LoFi: Low-Frequency Key Similarity for Query-Agnostic KV Cache Eviction"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = ["torch>=2.1", "transformers>=4.43.3"]

[tool.setuptools]
packages = ["lofi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
